<article class="card room-card mb-3">
    <div class="card-body">
        <h2 class="card-title">{{ group.name|default:"Без названия" }}</h2>
        <p class="card-text">Маршрут: {{ group.route }}</p>
        <p class="card-text">Вместимость: {{ group.max_capacity }} чел.</p>
        <a href="{% url 'tour_groups:detail' group.id %}" class="btn btn-sm btn-outline-primary">Подробнее</a>
    </div>
</article>
