{% extends "base.html" %}

{% block title %}Поездки{% endblock %}

{% block content %}
<h1>Расписание поездок</h1>
<ul class="list-group mt-3">
{% for trip in trips %}
    <li class="list-group-item">
        <strong>{{ trip.group_name }}</strong> — Дата: {{ trip.trip_date }}
    </li>
{% empty %}
    <li class="list-group-item">Поездки не найдены.</li>
{% endfor %}
</ul>
{% endblock %}
