{% extends "base.html" %}

{% block title %}Поездка №{{ trip.id }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h1 class="card-title">Поездка №{{ trip.id }}</h1>
        <p class="card-text"><strong>Группа:</strong> {{ trip.group.name }}</p>
        <p class="card-text"><strong>Маршрут:</strong> {{ trip.group.route }}</p>
        <p class="card-text"><strong>Дата:</strong> {{ trip.trip_date }}</p>
    </div>
</div>
<a href="{% url 'tour_trips:list' %}" class="btn btn-outline-secondary mt-3">← К списку поездок</a>
{% endblock %}
